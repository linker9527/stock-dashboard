# Cloudflare Workers 配置

name = "stock-dashboard-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

# 说明（BUG-12）：
# - 不需要 module_format 键。ESM 由 `export default { fetch() {...} }` 自动探测，
#   wrangler 官方配置里没有这个顶层键（esbuild 相关选项挂在 [esbuild] 表下）。
# - compatibility_date 故意保留较早日期，并配合下面的 nodejs_compat 显式开启。
#   官方文档：2026-08-04 起 nodejs_compat 才默认开启，早于该日期必须手动加。
#   我们用到 AbortController / setTimeout，属于 Web 标准 API 或 Node 兼容层，
#   当前组合是官方支持的正确写法，无需上调日期。
#
# Workers 部署后会得到形如:
# https://stock-dashboard-api.YOUR-ACCOUNT.workers.dev

# 如果要绑定自定义域名，在这里配置:
# [routes]
# pattern = "api.your-domain.com/*"
# zone_name = "your-domain.com"

# Pages 绑定 Worker（可选）
# 配置后，Pages 域名下的 /api/* 请求会转发到这个 Worker
compatibility_flags = ["nodejs_compat"]

# 前端静态文件 — Worker 同时提供前端页面和 API
[assets]
directory = "../frontend/"
# 必须显式声明绑定：index.js 的兜底分支用 ASSETS.fetch 处理未匹配路径。
# 不声明的话资产本身仍会被自动服务（/ 和 /app.js 等正常），
# 但 Worker 里 ASSETS 是 undefined，访问 /favicon.ico 等未匹配路径
# 会变成 1101 错误页而不是干净的 404
binding = "ASSETS"
